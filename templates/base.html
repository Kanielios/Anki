<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Anki MVP{% endblock %}</title>
    <script>
        if (localStorage.getItem('color-theme') === 'light') document.documentElement.classList.remove('dark');
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        .flip-card-inner { transition: transform 0.45s; transform-style: preserve-3d; }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back { backface-visibility: hidden; }
        .flip-card-back { transform: rotateY(180deg); }
        .perspective { perspective: 1200px; }
        /* Скроллбар для чата */
        .chat-scroll::-webkit-scrollbar { width: 4px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 transition-colors min-h-screen flex flex-col">

    <nav class="bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="{{ url_for('index') }}" class="text-xl font-bold text-indigo-600 dark:text-indigo-400">🃏 Anki MVP</a>
            <div class="flex items-center gap-4">
                <button id="theme-toggle" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800">🌗</button>
                {% if current_user.is_authenticated %}
                    <a href="{{ url_for('logout') }}" class="text-sm text-red-500">Выйти</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-4xl mx-auto w-full px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <button id="ai-chat-toggle" class="fixed bottom-6 right-6 w-14 h-14 bg-indigo-600 text-white rounded-full shadow-2xl flex items-center justify-center text-2xl hover:scale-110 transition-transform z-50">🤖</button>

    <div id="ai-chat-window" class="fixed bottom-24 right-6 w-80 sm:w-96 h-[450px] bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl shadow-2xl flex flex-col hidden z-50 overflow-hidden">
        <div class="p-4 bg-indigo-600 text-white flex justify-between items-center">
            <span class="font-bold text-sm">Llama 3 Assistant</span>
            <button id="close-chat" class="text-lg">✕</button>
        </div>
        <div id="chat-messages" class="flex-grow p-4 overflow-y-auto space-y-3 text-sm chat-scroll">
            <div class="bg-gray-100 dark:bg-gray-800 p-2 rounded-lg mr-8">Привет! Чем помочь?</div>
        </div>
        <div class="p-3 border-t dark:border-gray-800 flex gap-2">
            <input type="text" id="chat-input" placeholder="Спроси меня..." class="flex-grow bg-gray-50 dark:bg-gray-800 border dark:border-gray-700 rounded-lg px-3 py-2 text-sm outline-none">
            <button id="send-chat" class="bg-indigo-600 text-white px-3 py-2 rounded-lg">→</button>
        </div>
    </div>

    <script>
        // Тема
        document.getElementById('theme-toggle').addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('color-theme', isDark ? 'dark' : 'light');
        });

        // Чат
        const chatWin = document.getElementById('ai-chat-window');
        const chatMsg = document.getElementById('chat-messages');
        const chatInp = document.getElementById('chat-input');

        document.getElementById('ai-chat-toggle').onclick = () => chatWin.classList.toggle('hidden');
        document.getElementById('close-chat').onclick = () => chatWin.classList.add('hidden');

        function appendMsg(text, isUser = false) {
            const d = document.createElement('div');
            d.className = isUser ? 'bg-indigo-600 text-white p-2 rounded-lg ml-8 self-end' : 'bg-gray-100 dark:bg-gray-800 p-2 rounded-lg mr-8';
            d.innerText = text;
            chatMsg.appendChild(d);
            chatMsg.scrollTop = chatMsg.scrollHeight;
        }

        async function sendToAI() {
            const val = chatInp.value.trim();
            if (!val) return;
            appendMsg(val, true);
            chatInp.value = '';

            const contextWord = document.getElementById('front-text')?.innerText || '';
            try {
                const res = await fetch('/api/ai/explain', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ question: val, context: contextWord })
                });
                const data = await res.json();
                appendMsg(data.explanation || "Ошибка API");
            } catch { appendMsg("Ошибка сети"); }
        }

        document.getElementById('send-chat').onclick = sendToAI;
        chatInp.onkeypress = (e) => { if(e.key==='Enter') sendToAI(); };
    </script>
</body>
</html>
